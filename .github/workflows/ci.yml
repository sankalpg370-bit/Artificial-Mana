name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck security boundaries
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build the site
        run: npm run build
